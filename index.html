<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecos do Abismo</title>
    <link href="main.css" rel="stylesheet">
    <!-- Fonte -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">
    <!-- Fonte -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <div class="general">
        <div class="top-elements">
            <div id="title">Ecos do Abismo</div>
            <div class="nav-bar">
                <button class="nav-bar-btn" id="home">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" 
                    viewBox="0 0 24 24" fill="none" stroke="rgb(201, 201, 201)" 
                    stroke-width="1" stroke-linecap="round" stroke-linejoin="round" 
                    class="lucide lucide-house-icon lucide-house">
                        <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/>
                        <path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    </svg>
                </button>
                
                <button class="nav-bar-btn" id="story">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" 
                    viewBox="0 0 24 24" fill="none" stroke="rgb(201, 201, 201)" 
                    stroke-width="1" stroke-linecap="round" stroke-linejoin="round" 
                    class="lucide lucide-book-open-text-icon lucide-book-open-text">
                        <path d="M12 7v14"/><path d="M16 12h2"/><path d="M16 8h2"/>
                        <path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>
                        <path d="M6 12h2"/><path d="M6 8h2"/>
                    </svg>
                </button>
                
                <button class="nav-bar-btn" id="inventory">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"
                     viewBox="0 0 24 24" fill="none" stroke="rgb(201, 201, 201)" 
                     stroke-width="1" stroke-linecap="round" stroke-linejoin="round" 
                     class="lucide lucide-package2-icon lucide-package-2">
                        <path d="M12 3v6"/><path d="M16.76 3a2 2 0 0 1 1.8 1.1l2.23 4.479a2 2 0 0 1 .21.891V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9.472a2 2 0 0 1 .211-.894L5.45 4.1A2 2 0 0 1 7.24 3z"/>
                        <path d="M3.054 9.013h17.893"/>
                    </svg>
                </button>
    
                <button class="nav-bar-btn" id="docs">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"
                    viewBox="0 0 24 24" fill="none" stroke="rgb(201, 201, 201)" 
                    stroke-width="1" stroke-linecap="round" stroke-linejoin="round" 
                    class="lucide lucide-library-big-icon lucide-library-big">
                        <rect width="8" height="18" x="3" y="3" rx="1"/>
                        <path d="M7 3v18"/><path d="M20.4 18.9c.2.5-.1 1.1-.6 1.3l-1.9.7c-.5.2-1.1-.1-1.3-.6L11.1 5.1c-.2-.5.1-1.1.6-1.3l1.9-.7c.5-.2 1.1.1 1.3.6Z"/>
                    </svg>
                </button>
            </div>
        </div>
        <div class="profile">
            <div class="left-div">
                <div class="main-info">
                    <p id="info-titles">Perfil do Jogador</p>
                </div>
                <div class="abilities">
                    <p id="info-titles">Habilidades da Organização</p>
                </div>
            </div>

            <div class="separator">
                <!-- Uma linha de um pixel apenas para separação. Vide CSS -->
            </div>

            <div class="right-div">
                <div class="atributes">
                    <p id="info-titles">Atributos</p>
                </div>
                <div class="resources">
                    <p id="info-titles">Recursos Especiais</p>
                </div>
            </div>
        </div>
    </div>
    <script src="main.js"></script>
